[project]
name = "depsdev-mcp"
version = "0.1.0"
description = "MCP server for the deps.dev (Open Source Insights) API: package, dependency, advisory and project health lookups."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ankur Kapuriya" }]
requires-python = ">=3.12"
keywords = ["mcp", "deps.dev", "dependencies", "security", "supply-chain"]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0,<3",
]

[project.scripts]
depsdev-mcp = "depsdev_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
